company: ADP Labs
title: Software Engineer II
start: 2022-12
context:
  en: International payroll platform.
  pt-br: Plataforma internacional de folha de pagamento.
achievements:
  - en: I designed and delivered the platform's micro-frontend web components, written in TypeScript with Stencil and tested with Jest and Cypress.
    pt-br: Arquitetei e entreguei os web components de micro-frontend da plataforma, escritos em TypeScript com Stencil e testados com Jest e Cypress.
  - en: I moved to the backend, where I designed and built REST microservices in Java and Spring Boot, with MySQL, running in Docker containers orchestrated by Kubernetes on AWS.
    pt-br: Passei para o backend, onde projetei e desenvolvi microsserviços REST com Java e Spring Boot, com MySQL, em contêineres Docker orquestrados por Kubernetes na AWS.
  - en: I kept quality in check with TDD (JUnit) and BDD (Cucumber) suites, and used Spring Cloud Contract to validate the contracts between microservices and micro-frontends.
    pt-br: Garanti a qualidade com suítes de TDD (JUnit) e BDD (Cucumber), e usei Spring Cloud Contract para validar os contratos entre microsserviços e micro-frontends.
  - en: I improved the response time of the APIs with distributed caching, using Caffeine and Redis, so they could handle large volumes of payroll data.
    pt-br: Melhorei o tempo de resposta das APIs com cache distribuído, usando Caffeine e Redis, para lidar com grandes volumes de dados de folha de pagamento.
