# The phrases of the fixed pages, in Portuguese. The file en.yaml has the same
# keys, in English. Phrases marked with [Exemplo] are still to be written.

# Phrases of the layout shared by every page.
common:
  # The names of the menu and of the language button, for screen readers.
  menu: Principal
  language: Idioma
  # The link that skips the menu, for keyboard users.
  skip: Pular para o conteúdo
  # The feed link, in the footer.
  feed: Feed

home:
  name: Início
  description: "[Exemplo] Descrição da página Início."
  label: Engenheiro de software com foco em backend e IA
  intro: Construo serviços de backend e sistemas que usam LLMs, e programo com agentes de IA guiados por especificação.
  # The blocks of the floor plan: the title of each one and, where the caption
  # does not come from another file, the caption.
  blocks:
    research: Sistemas que usam LLMs
    methodCaption: Método
    method: Agentes guiados por especificação
    experienceCaption: Experiência
    experience: Serviços de backend
  # The end of the experience while the current role has none.
  today: hoje
  # The paper callout: one plain sentence, without numbers.
  paper: "[Exemplo] Uma frase simples sobre o paper, sem números."
  # Comes before the start month of a study in progress.
  since: desde
  # The link that closes each section.
  more:
    research: Sobre a pesquisa
    projects: Todos os projetos
    writing: Todos os textos
    studies: Todos os estudos
    about: Mais sobre mim

projects:
  name: Projetos
  description: "[Exemplo] Descrição da página Projetos."
  # The name of each project state.
  states:
    works-locally: funciona localmente
    in-development: em desenvolvimento
    in-planning: em planejamento
  # Comes before the "updated on" date of a project story.
  updatedOn: atualizada em
  # The title of the section of a project story that leads to the others.
  others: Outros projetos

writing:
  name: Textos
  description: "[Exemplo] Descrição da página Textos."
  # The name of each text type.
  types:
    article: artigo
    study-note: nota de estudo
  # The name of each topic.
  topics:
    backend: backend
    frontend: frontend
    architecture: arquitetura
    ai: IA
    career: carreira
    academic: acadêmico
  # The link that closes the page of a text and leads back to the list.
  all: Todos os textos
  # Comes before the date of the content revision of a text.
  updatedOn: atualizado em
  # Comes before the study a text came from.
  study: estudo de origem
  # The translation note. A translation shown in Portuguese was written in
  # English: `from` names the original language, `original` is the link to
  # the original and `withAI` is the notice of a translation made with AI.
  translationNote:
    from: Traduzido do inglês.
    original: Ler o original
    withAI: Esta tradução foi feita com IA.

studies:
  name: Estudos
  description: "[Exemplo] Descrição da página Estudos."

research:
  name: Pesquisa
  description: "[Exemplo] Descrição da página Pesquisa."

about:
  name: Sobre
  description: "[Exemplo] Descrição da página Sobre."
  bio: "[Exemplo] Este parágrafo ocupa o lugar da bio, que ainda vai ser escrita."
  education: Bacharelado em Sistemas de Informação, UNISINOS, concluído em 2025

# The page shown when the address does not exist.
notFound:
  name: Página não encontrada
