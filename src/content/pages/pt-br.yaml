# The phrases of the fixed pages, in Portuguese. The file en.yaml has the same
# keys, in English. Phrases marked with [Exemplo] are still to be written.

# Phrases of the layout shared by every page.
common:
  # The names of the menu and of the language button, for screen readers.
  menu: Principal
  language: Idioma
  # The link that skips the menu, for keyboard users.
  skip: Pular para o conteúdo
  # The feed link, in the footer.
  feed: Feed

home:
  name: Início
  description: "O site de Shaihan Buenos, engenheiro de software com foco em backend e IA: projetos, textos, estudos, pesquisa e experiência."
  label: Engenheiro de software com foco em backend e IA
  intro: Construo serviços de backend e sistemas que usam LLMs, e programo com agentes de IA guiados por especificação.
  # The blocks of the floor plan: the title of each one and, where the caption
  # does not come from another file, the caption.
  blocks:
    research: Sistemas que usam LLMs
    methodCaption: Método
    method: Agentes guiados por especificação
    experienceCaption: Experiência
    experience: Serviços de backend
  # The end of the experience while the current role has none.
  today: hoje
  # The paper callout: one plain sentence, without numbers.
  paper: Uma arquitetura que põe um LLM para acompanhar as leituras de pressão arterial de pacientes simulados, com a resposta num formato fixo, conferido por código.
  # The link that closes each section.
  more:
    research: Sobre a pesquisa
    projects: Todos os projetos
    writing: Todos os textos
    studies: Todos os estudos
    about: Mais sobre mim

projects:
  name: Projetos
  description: "Os projetos que construo por conta própria, com agentes de IA guiados por especificação: o estado de cada um e as decisões de engenharia."
  # The name of each project state.
  states:
    works-locally: funciona localmente
    in-development: em desenvolvimento
    in-planning: em planejamento
  # Comes before the "updated on" date of a project story.
  updatedOn: atualizada em
  # The title of the section of a project story that leads to the others.
  others: Outros projetos

writing:
  name: Textos
  description: "Artigos e notas de estudo sobre backend, arquitetura e IA, cada texto no idioma em que foi escrito."
  # The name of each text type.
  types:
    article: artigo
    study-note: nota de estudo
  # The name of each topic.
  topics:
    backend: backend
    frontend: frontend
    architecture: arquitetura
    ai: IA
    career: carreira
    academic: acadêmico
  # The link that closes the page of a text and leads back to the list.
  all: Todos os textos
  # Comes before the date of the content revision of a text.
  updatedOn: atualizado em
  # Comes before the study a text came from.
  study: estudo de origem
  # The translation note. A translation shown in Portuguese was written in
  # English: `from` names the original language, `original` is the link to
  # the original and `withAI` is the notice of a translation made with AI.
  translationNote:
    from: Traduzido do inglês.
    original: Ler o original
    withAI: Esta tradução foi feita com IA.

studies:
  name: Estudos
  description: "Os estudos em andamento e os que já concluí, com o status de cada um e os textos e projetos ligados a ele."
  # Comes before the month of the last check of the study list.
  checkedOn: conferida em
  # The title of the group of the studies in progress.
  inProgress: Em andamento
  # Comes before the year in the title of a group of completed studies.
  completedIn: Concluídos em
  # The name of each study status.
  statuses:
    in-progress: em andamento
    completed: concluído
  # Comes before the start month of a study in progress.
  since: desde
  # What comes before each kind of link of a study.
  links:
    texts: Textos
    project: Projeto
    certificate: Certificado
    education: Formação
    research: Pesquisa

research:
  name: Pesquisa
  description: "Meu trabalho acadêmico: um paper publicado pelo IEEE sobre o uso de LLMs no acompanhamento da hipertensão, e o TCC que foi o ponto de partida dele."
  # What comes before each field of a research item.
  fields:
    whatItIs: O que é
    summary: Resumo
    built: O que construí
    result: Resultado
  # The link to the paper, by its DOI.
  readPaper: Ler no IEEE Xplore
  # What the thesis says in place of a file. It is the link to the contact.
  onRequest: Disponível a pedido
  # The caption of the paper's diagram. The diagram itself is still to be drawn.
  diagramCaption: "[Exemplo] O diagrama da arquitetura, redesenhado no estilo do site, entra aqui."

about:
  name: Sobre
  description: "Quem é Shaihan Buenos: a bio, a experiência como engenheiro de software, a formação e o contato."
  bio: "Sou engenheiro de software na ADP Labs, em Porto Alegre, onde trabalho com serviços de backend. O meu lado de IA vem de fora do emprego: sou primeiro autor de um paper publicado pelo IEEE sobre o uso de LLMs no acompanhamento da hipertensão, e construo projetos próprios com agentes de IA guiados por especificação. Hoje estudo React e TypeScript e esse jeito de programar com agentes, e escrevo aqui sobre o que aprendo."
  # The alternative text of the avatar.
  avatarAlt: Avatar de Shaihan Buenos em pixel art
  # The end of a period while the role is the current one.
  present: hoje
  education: Bacharelado em Sistemas de Informação, UNISINOS, concluído em 2025
  # The title of the section of the contact.
  contact: Contato

# The page shown when the address does not exist.
notFound:
  name: Página não encontrada
  description: Este endereço não existe em shaihanbuenos.dev.
