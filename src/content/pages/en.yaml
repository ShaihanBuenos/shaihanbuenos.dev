# The phrases of the fixed pages, in English. The file pt-br.yaml has the same
# keys, in Portuguese. Phrases marked with [Example] are still to be written.

# Phrases of the layout shared by every page.
common:
  # The names of the menu and of the language button, for screen readers.
  menu: Main
  language: Language
  # The link that skips the menu, for keyboard users.
  skip: Skip to content
  # The feed link, in the footer.
  feed: Feed

home:
  name: Home
  description: "[Example] Description of the Home page."
  label: Software Engineer focused on backend and AI
  intro: I build backend services and systems that use LLMs, and I write code with AI agents guided by specs.
  # The blocks of the floor plan: the title of each one and, where the caption
  # does not come from another file, the caption.
  blocks:
    research: Systems that use LLMs
    methodCaption: Method
    method: Agents guided by specs
    experienceCaption: Experience
    experience: Backend services
  # The end of the experience while the current role has none.
  today: today
  # The paper callout: one plain sentence, without numbers.
  paper: "[Example] One plain sentence about the paper, without numbers."
  # The link that closes each section.
  more:
    research: About the research
    projects: All projects
    writing: All texts
    studies: All studies
    about: More about me

projects:
  name: Projects
  description: "[Example] Description of the Projects page."
  # The name of each project state.
  states:
    works-locally: works locally
    in-development: in development
    in-planning: in planning
  # Comes before the "updated on" date of a project story.
  updatedOn: updated on
  # The title of the section of a project story that leads to the others.
  others: Other projects

writing:
  name: Writing
  description: "[Example] Description of the Writing page."
  # The name of each text type.
  types:
    article: article
    study-note: study note
  # The name of each topic.
  topics:
    backend: backend
    frontend: frontend
    architecture: architecture
    ai: AI
    career: career
    academic: academic
  # The link that closes the page of a text and leads back to the list.
  all: All texts
  # Comes before the date of the content revision of a text.
  updatedOn: updated on
  # Comes before the study a text came from.
  study: source study
  # The translation note. A translation shown in English was written in
  # Portuguese: `from` names the original language, `original` is the link to
  # the original and `withAI` is the notice of a translation made with AI.
  translationNote:
    from: Translated from Portuguese.
    original: Read the original
    withAI: This translation was made with AI.

studies:
  name: Studies
  description: "[Example] Description of the Studies page."
  # Comes before the month of the last check of the study list.
  checkedOn: checked in
  # The title of the group of the studies in progress.
  inProgress: In progress
  # Comes before the year in the title of a group of completed studies.
  completedIn: Completed in
  # The name of each study status.
  statuses:
    in-progress: in progress
    completed: completed
  # Comes before the start month of a study in progress.
  since: since
  # What comes before each kind of link of a study.
  links:
    texts: Texts
    project: Project
    certificate: Certificate
    education: Education
    research: Research

research:
  name: Research
  description: "[Example] Description of the Research page."
  # What comes before each field of a research item.
  fields:
    whatItIs: What it is
    summary: Summary
    built: What I built
    result: Result
  # The link to the paper, by its DOI.
  readPaper: Read on IEEE Xplore
  # What the thesis says in place of a file. It is the link to the contact.
  onRequest: Available on request
  # The caption of the paper's diagram. The diagram itself is still to be drawn.
  diagramCaption: "[Example] The architecture diagram, redrawn in the style of the site, goes here."

about:
  name: About
  description: "[Example] Description of the About page."
  bio: "[Example] This paragraph stands in for the bio, which is still to be written."
  education: Bachelor's degree in Information Systems, UNISINOS, completed in 2025

# The page shown when the address does not exist.
notFound:
  name: Page not found
